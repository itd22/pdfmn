[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftui"
version = "0.1.0"
description = "Crawl a directory for PDFs and maintain a books manifest (json / yaml / sqlite)."
requires-python = ">=3.9"
dependencies = [
    "certifi>=2026.7.22",
    "charset-normalizer>=3.4.9",
    "click>=8.4.2",
    "idna>=3.18",
    "lxml>=6.1.1",
    "packaging>=26.2",
    "pikepdf>=10.11.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "SQLAlchemy>=2.0.51",
    "textual>=8.2.8",
    "urllib3>=2.7.0",
]
# backend (pdfpz) is still a git submodule pinned by commit, not a
# package-index dep for pdfpz itself: `pip install -e ./backend -e .`
# (see run_app.sh). The list above mirrors pdfpz's own dependencies
# (backend/pyproject.toml) so `pip install .` alone -- without the
# submodule editable install -- still pulls in everything pdftui's
# `import pdfpz...` calls need at runtime. Keep the two lists in sync
# whenever backend/pyproject.toml's dependencies change.

[project.scripts]
pdftui = "pdftui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
