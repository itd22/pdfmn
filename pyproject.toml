[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftui"
version = "0.1.0"
description = "Crawl a directory for PDFs and maintain a books manifest (json / yaml / sqlite)."
requires-python = ">=3.9"
dependencies = [
    "click>=8.4.2",
    "PyYAML>=6.0.3",
    "textual>=8.2.8",
]
# backend (pdfpz) is a git submodule pinned to v0.6.0, not a package-index dep: `pip install -e ./backend -e .` (see run_app.sh).
# SQLAlchemy now lives with pdfpz (src/pdfpz/bridges/db_bridge.py, db_schema.py).
# TUI is Textual-based (src/pdftui/tui.py) as of package73 -- no more curses,
# so windows-curses is no longer a dependency.

[project.scripts]
pdftui = "pdftui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
